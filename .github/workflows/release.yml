name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release and assets
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test
        run: go test -count=1 ./...
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@^11.15.0
      - name: Build npm packages
        run: node scripts/npm-packages.mjs "${GITHUB_REF_NAME#v}"
      - name: Publish to npm
        run: scripts/npm-publish.sh

  gh-extension:
    # `gh extension install` only accepts repositories named gh-*, so the
    # gh-prwatch_* binaries are mirrored to tvdavies/gh-prwatch. Skipped
    # until the GH_EXTENSION_TOKEN secret exists (see RELEASING.md).
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Mirror release to tvdavies/gh-prwatch
        env:
          GH_TOKEN: ${{ secrets.GH_EXTENSION_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_EXTENSION_TOKEN is not set; skipping the gh extension mirror."
            exit 0
          fi
          mkdir assets
          gh release download "$TAG" --repo tvdavies/prwatch --pattern 'gh-prwatch_*' --dir assets
          ls -l assets
          if gh release view "$TAG" --repo tvdavies/gh-prwatch >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --repo tvdavies/gh-prwatch --clobber
          else
            gh release create "$TAG" assets/* --repo tvdavies/gh-prwatch --title "$TAG" \
              --notes "Binaries for \`gh extension install tvdavies/gh-prwatch\`. Source and release notes: https://github.com/tvdavies/prwatch/releases/tag/$TAG"
          fi
