name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: static build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags "-s -w" -o prwatch .
          ./prwatch version

  package:
    name: release dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Build npm packages
        run: node scripts/npm-packages.mjs 0.0.0-ci
      - name: Install from packed tarballs and check the bin is native
        run: |
          mkdir -p /tmp/tgz
          for d in prwatch-linux-x64 prwatch; do (cd "npm/dist/$d" && npm pack --pack-destination /tmp/tgz); done
          npm install -g --prefix /tmp/npm-global /tmp/tgz/tvdavies-prwatch-linux-x64-0.0.0-ci.tgz /tmp/tgz/prwatch-0.0.0-ci.tgz
          file -L /tmp/npm-global/bin/prwatch | tee /dev/stderr | grep -q ELF
          /tmp/npm-global/bin/prwatch version
          npm install -g --ignore-scripts --prefix /tmp/npm-shim /tmp/tgz/tvdavies-prwatch-linux-x64-0.0.0-ci.tgz /tmp/tgz/prwatch-0.0.0-ci.tgz
          /tmp/npm-shim/bin/prwatch version
